<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>网站维护中</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    background:radial-gradient(120% 80% at 50% -10%,#2a2d33 0%,transparent 55%),linear-gradient(180deg,#1a1c20 0%,#23262b 100%);
    color:#fff;min-height:100%;
    display:flex;align-items:center;justify-content:center;
    padding:max(24px,env(safe-area-inset-top)) 20px max(24px,env(safe-area-inset-bottom));
    -webkit-font-smoothing:antialiased;
  }
  .card{width:100%;max-width:380px;text-align:center}
  h1{font-size:24px;font-weight:700;margin-bottom:12px}
  .sub{font-size:15px;line-height:1.7;color:#b8bcc4;margin-bottom:26px}
  .bar{height:4px;border-radius:4px;background:rgba(255,255,255,.12);overflow:hidden;margin-bottom:24px}
  .bar i{display:block;height:100%;width:40%;background:#e82127;border-radius:4px;animation:move 1.4s ease-in-out infinite}
  @keyframes move{0%{transform:translateX(-100%)}100%{transform:translateX(350%)}}
  .tip{font-size:13px;color:#8a8f98;line-height:1.7}
  .tip b{color:#cfd3da;font-weight:600}
</style>
</head>
<body>
  <div class="card">
    <h1>网站维护中</h1>
    <p class="sub">系统正在升级维护，暂时无法访问。<br>给您带来不便，敬请谅解。</p>
    <div class="bar"><i></i></div>
    <p class="tip">预计稍后恢复 · 如有紧急需求<br>请联系您的专属顾问</p>
  </div>
</body>
</html>
